name: Sync konten dari Supabase

# Menarik konten yang diedit lewat panel /admin ke src/data/synced/, lalu —
# HANYA bila ada perubahan — commit dan deploy ulang ke GitHub Pages.
#   • site-content.json ← tabel `site_content`  (banner pengumuman)
#   • partnership.json  ← tabel `partnership_*` (konten & HARGA /partnership)
#   • products.json     ← tabel `products` + media & rilis
#   • pages.json        ← tabel `page_content`
#   • faq.json          ← tabel `faq_categories` + `faqs` (seluruh panduan)
# Lihat docs/ADMIN-CMS.md bagian 6 & 12, dan docs/PIPELINE-TERBIT.md untuk
# perkiraan waktu tayang serta cara menerbitkan segera.
#
# Butuh dua secret:
#   SUPABASE_URL               → URL project Supabase
#   SUPABASE_SERVICE_ROLE_KEY  → service role key (mem-bypass RLS)
#
# Service role key HANYA hidup di sini. Ia tidak pernah ikut ke bundle browser;
# yang dikirim ke pengunjung cuma HTML hasil build.
# Tanpa secret ini workflow tetap lewat dengan aman: konten lama dipertahankan.

on:
  schedule:
    # Tiap 15 menit. GitHub sering menunda jadwal (pernah terpantau 30–50 menit,
    # sesekali berjam-jam), jadi ini batas bawah, bukan janji. Untuk terbit
    # sekarang juga: tab Actions → workflow ini → "Run workflow".
    - cron: '*/15 * * * *'
  workflow_dispatch:          # tombol "Run workflow" untuk terbit segera

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages                # serialisasi dengan workflow deploy & sync-data
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ambil `main` yang TERBARU, bukan snapshot dari saat run diantrekan.
          # Karena jadwal kerap tertunda, tanpa ini runner bisa bekerja di atas
          # pohon kerja yang sudah usang — skrip lama, dan push pasti ditolak.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tarik konten dari Supabase
        run: node scripts/sync-content.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit bila ada perubahan konten
        id: commit
        run: |
          git config user.name "vanillate-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Semua keluaran sync-content.mjs ikut di-stage. Sebelumnya hanya dua
          # yang pertama yang disebut di sini, jadi hasil sync products.json dan
          # pages.json tidak pernah ikut ter-commit — konten CMS-nya baru tampil
          # bila kebetulan ada commit lain. faq.json ikut aturan yang sama.
          git add src/data/synced/site-content.json \
                  src/data/synced/partnership.json \
                  src/data/synced/products.json \
                  src/data/synced/pages.json \
                  src/data/synced/faq.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✓ Konten tidak berubah — lewati deploy."
            exit 0
          fi

          git commit -m "chore(konten): sync dari Supabase"

          # `main` bisa maju (merge PR, run sync lain) selagi run ini berjalan.
          # Tanpa rebase, push ditolak "fetch first" → job merah dan konten baru
          # tidak pernah terbit sampai jadwal berikutnya. Rebase dulu, lalu ulangi
          # beberapa kali kalau ada yang push berbarengan.
          terkirim=false
          for percobaan in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              terkirim=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "! Push gagal (percobaan ${percobaan}/3) — main mungkin baru maju, coba lagi."
            sleep $(( percobaan * 5 ))
          done

          if [ "$terkirim" != true ]; then
            echo "::error::Gagal push konten hasil sync setelah 3 percobaan. Konten belum terbit."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "✓ Konten berubah — commit & deploy."

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
