name: Sync konten dari Supabase

# Menarik tabel `site_content` (diedit lewat panel /admin) ke
# src/data/synced/site-content.json, lalu — HANYA bila ada perubahan — commit
# dan deploy ulang ke GitHub Pages. Lihat docs/ADMIN-CMS.md bagian 6.
#
# Butuh dua secret:
#   SUPABASE_URL               → URL project Supabase
#   SUPABASE_SERVICE_ROLE_KEY  → service role key (mem-bypass RLS)
#
# Service role key HANYA hidup di sini. Ia tidak pernah ikut ke bundle browser;
# yang dikirim ke pengunjung cuma HTML hasil build.
# Tanpa secret ini workflow tetap lewat dengan aman: konten lama dipertahankan.

on:
  schedule:
    - cron: '15 * * * *'     # tiap jam di menit ke-15
  workflow_dispatch:          # tombol "Run workflow" untuk terbit segera

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages                # serialisasi dengan workflow deploy & sync-data
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tarik konten dari Supabase
        run: node scripts/sync-content.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit bila ada perubahan konten
        id: commit
        run: |
          git config user.name "vanillate-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/synced/site-content.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✓ Konten tidak berubah — lewati deploy."
          else
            git commit -m "chore(konten): sync dari Supabase"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✓ Konten berubah — commit & deploy."
          fi

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
