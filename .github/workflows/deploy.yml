name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bangun ulang harian supaya daftar server pemakai bot (Showcase Server,
  # docs/SHOWCASE-SERVER.md) dan sampel acak hariannya ikut segar. 20:17 UTC =
  # 03:17 WIB, sepi pengunjung.
  schedule:
    - cron: '17 20 * * *'
  # Dikirim Edge Function `blog-admin` setiap artikel blog terbit/ditarik/dihapus
  # (butuh secret GITHUB_DISPATCH_TOKEN di Supabase). Lihat docs/BLOG.md.
  repository_dispatch:
    types: [blog-publish]

permissions: {}

concurrency:
  group: pages
  # JANGAN dibatalkan di tengah jalan. Grup `pages` ini dipakai bersama kedua
  # workflow sync, dan run sync sudah menekan commit-nya ke `main` sebelum
  # membangun. Kalau run itu dibunuh saat build, isinya ada di repo tapi tidak
  # pernah tayang — dan sync berikutnya melihat "tidak ada perubahan" sehingga
  # situs bisa tertinggal diam-diam. Antre lebih aman daripada cepat.
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
    with:
      revision: ${{ github.sha }}
    secrets:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_BOT_SUPABASE_URL: ${{ secrets.PUBLIC_BOT_SUPABASE_URL }}
      PUBLIC_BOT_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_BOT_SUPABASE_ANON_KEY }}
      PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
