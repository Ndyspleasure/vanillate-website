name: Sync data dari bot repo

# Menarik data source-of-truth dari repo bot (Ndyspleasure/sambung-kata-bot),
# menuliskannya ke src/data/synced/*.json, dan — HANYA bila ada perubahan —
# commit lalu build & deploy ke GitHub Pages. Lihat docs/AUTO-SYNC-DATA.md dan
# docs/PIPELINE-TERBIT.md.
#
# Repo bot PRIVAT → butuh secret BOT_REPO_TOKEN (fine-grained PAT, izin
# Contents: Read pada sambung-kata-bot). Tanpa secret ini, sync akan gagal
# dengan aman (tidak ada data yang berubah).
#
# Satu job: build & deploy memakai working tree yang SUDAH berisi data hasil
# fetch (bukan checkout ulang), jadi selalu memakai data terbaru.

on:
  schedule:
    # Tiap jam. Rilis bot (versi & changelog) biasanya menyusul beberapa menit
    # setelah PR-nya merge; jadwal 6 jam dulu membuat halaman /status dan
    # /changelog tertinggal setengah hari. GitHub kerap menunda jadwal ini —
    # untuk sync sekarang juga, pakai "Run workflow".
    - cron: '0 * * * *'
  workflow_dispatch:          # tombol "Run workflow" untuk sync manual

permissions:
  contents: write   # commit data hasil sync ke main
  pages: write      # deploy Pages
  id-token: write   # OIDC untuk deploy-pages

concurrency:
  group: pages       # serialisasi dengan workflow deploy utama
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ambil `main` yang TERBARU, bukan snapshot dari saat run diantrekan.
          # Karena jadwal kerap tertunda, tanpa ini runner bisa bekerja di atas
          # pohon kerja yang sudah usang — skrip lama, dan push pasti ditolak.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tarik data dari repo bot
        run: node scripts/sync-data.mjs
        env:
          BOT_REPO: Ndyspleasure/sambung-kata-bot
          BOT_BRANCH: main
          BOT_REPO_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}

      - name: Commit bila ada perubahan data
        id: commit
        run: |
          git config user.name "vanillate-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Deteksi perubahan HANYA pada file data (bukan _status.json yang
          # selalu berubah karena timestamp) → tidak ada deploy sia-sia.
          git add src/data/synced/shop.json \
                  src/data/synced/bot-info.json \
                  src/data/synced/version.json \
                  src/data/synced/changelog.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✓ Tidak ada perubahan data — lewati deploy."
            exit 0
          fi

          git add src/data/synced/_status.json
          git commit -m "chore(data): sync dari sambung-kata-bot"

          # `main` bisa maju (merge PR, run sync konten) selagi run ini berjalan.
          # Tanpa rebase, push ditolak "fetch first" → job merah dan data baru
          # tidak pernah terbit sampai jadwal berikutnya. Rebase dulu, lalu ulangi
          # beberapa kali kalau ada yang push berbarengan.
          terkirim=false
          for percobaan in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              terkirim=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "! Push gagal (percobaan ${percobaan}/3) — main mungkin baru maju, coba lagi."
            sleep $(( percobaan * 5 ))
          done

          if [ "$terkirim" != true ]; then
            echo "::error::Gagal push data hasil sync setelah 3 percobaan. Data belum terbit."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "✓ Data berubah — commit & deploy."

      # Langkah build & deploy hanya jalan bila data berubah. Semuanya memakai
      # working tree yang sudah berisi data terbaru dari langkah fetch di atas.
      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build
        env:
          # Kunci publik Supabase untuk panel /admin. Keduanya memang ikut
          # terkirim ke browser — itu wajar untuk anon key. Yang menjaga data
          # adalah Row Level Security di Supabase, bukan kerahasiaan kunci ini.
          # Bila secret belum diisi, build tetap jalan dan form login otomatis
          # menampilkan panduan setup.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
